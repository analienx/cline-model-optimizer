name: Windows regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell sources
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src, tests -Recurse -Include *.ps1, *.psm1 -ErrorAction SilentlyContinue | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }
      - name: Run Foundry route regressions
        shell: pwsh
        run: ./tests/Test-CmoFoundryRoute.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test single-screen and account dashboard contracts
        shell: pwsh
        run: |
          python -m pip install pytest
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\python;$env:GITHUB_WORKSPACE\tests"
          python -m pytest -q tests/test_single_screen_experience.py tests/test_simple_dashboard.py
      - name: Check dashboard JavaScript syntax
        shell: pwsh
        run: node --check python/cmo/web/advanced.js
